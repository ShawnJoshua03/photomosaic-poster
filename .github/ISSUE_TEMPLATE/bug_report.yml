name: Bug report
description: Something crashed, or a poster came out wrong.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error
      description: The full message. Remove anything private (paths with names are fine to redact).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Versions
      description: "Output of: mosaic-poster --version && python --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't attach photos of people. If an input file triggers the bug, describe it (format, size, phone model) or attach a non-personal file that reproduces it.
