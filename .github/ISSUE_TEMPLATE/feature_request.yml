name: Idea or request
description: Something that would make posters easier or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: The situation matters more than the solution - what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
